[project]
name = "pipeline-api"
version = "0.1.0"
description = "API service for managing data pipelines"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi>=0.124.4",
    "uvicorn[standard]>=0.38.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api_server"]
