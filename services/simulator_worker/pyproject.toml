[project]
name = "simulator-worker"
version = "0.1.0"
description = "Stateless Kafka worker that simulates pipeline runs from PIPELINE_REQUESTED commands"
requires-python = ">=3.12, <3.13"
dependencies = [
    "confluent-kafka>=2.12.2",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/simulator_worker"]
